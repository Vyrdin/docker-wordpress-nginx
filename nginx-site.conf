server {
    listen 80;
    listen [::]:80;
    
    servername ;
    root /usr/share/nginx/html;
    index index.php index.html index.htm;

    # Security headers
    addheader X-Frame-Options "SAMEORIGIN" always;
    addheader X-Content-Type-Options "nosniff" always;
    addheader X-XSS-Protection "1; mode=block" always;
    addheader Referrer-Policy "strict-origin-when-cross-origin" always;

    # Main location
    location / {
        tryfiles $uri $uri/ /index.php?$args;
    }

    # PHP file handling
    location ~ \.php$ {
        tryfiles $uri =404;
        fastcgisplitpathinfo ^(.+\.php)(/.+)$;
        fastcgipass phpbackend;
        fastcgiindex index.php;
        include fastcgiparams;
        fastcgiparam SCRIPTFILENAME $documentroot$fastcgiscriptname;
        fastcgiparam SCRIPTNAME $fastcgiscriptname;
        
        fastcgiconnecttimeout 60s;
        fastcgisendtimeout 60s;
        fastcgireadtimeout 60s;
    }

    # Static files caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
    }

    location ~ ~$ {
        deny all;
    }
}
